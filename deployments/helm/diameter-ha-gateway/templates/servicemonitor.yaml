{{- if .Values.serviceMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "diameter-ha-gateway.fullname" . }}
  labels:
    {{- include "diameter-ha-gateway.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "diameter-ha-gateway.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
