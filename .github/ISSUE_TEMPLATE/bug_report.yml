name: Bug report
description: Something does not behave as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here — use
        [private vulnerability reporting](https://github.com/3eAI-Labs/diameter-ha-gateway/security/advisories/new)
        instead. Do not paste real subscriber identities (IMSI, MSISDN) or operator Diameter identities.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Diameter base protocol (peers, CER/CEA, DWR/DWA, DPR/DPA)
        - S6a
        - S13
        - Gx
        - Gy / Ro
        - SGd
        - NATS bridge
        - Admin API / web UI
        - Helm chart
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Gateway version
      description: Container image tag or commit.
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - SCTP
        - TCP
        - TLS over TCP
    validations:
      required: true

  - type: input
    id: peer
    attributes:
      label: Peer equipment
      description: The MME / PCEF / DRA / other Diameter node on the other side, vendor and version if known.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect instead
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >
        A failing test, a sanitised PCAP, or the exact message sequence is the fastest route to a fix.
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: The relevant part of config.yaml or Helm values. Remove credentials.
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
